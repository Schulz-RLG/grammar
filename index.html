<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grammar Training">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Grammar Training</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#ECEFF2;--sf:#FAFBFC;--ink:#1A1D25;--mut:#5A616E;--ln:#CBD1DA;--pri:#2A4BC0;--acc:#FFE45C;--onacc:#1A1D25;--red:#CF2F27;--gold:#B88400;--gapbg:#FFE45C;--r:3px;
  --fu:"Avenir Next","Avenir","Segoe UI",system-ui,sans-serif;
  --ft:Charter,"Bitstream Charter","Iowan Old Style",ui-serif,Georgia,"Noto Serif",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#14161B;--sf:#1C1F27;--ink:#E8EAEE;--mut:#9BA2AE;--ln:#333945;--pri:#93AAFF;--acc:#6B5A00;--onacc:#FFF6C7;--red:#FF7468;--gold:#E5B93C;--gapbg:#5A4C00}
}
:root[data-theme="dark"]{--bg:#14161B;--sf:#1C1F27;--ink:#E8EAEE;--mut:#9BA2AE;--ln:#333945;--pri:#93AAFF;--acc:#6B5A00;--onacc:#FFF6C7;--red:#FF7468;--gold:#E5B93C;--gapbg:#5A4C00}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fu);font-size:16px;line-height:1.45;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
h1,h2,h3,p{margin:0}
/* Figuren (Pauls Bilder): feste Höhe pro Stelle, Figur unten mittig, weißer Rand wie ein Sticker. Gold: goldener Rand. */
.dg{display:block;width:100%;height:auto;object-fit:contain;object-position:50% 100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)}
.dg.gold{filter:drop-shadow(3px 0 0 #E2A600) drop-shadow(-3px 0 0 #E2A600) drop-shadow(0 3px 0 #E2A600) drop-shadow(0 -3px 0 #E2A600)}
.rw .mini .dg,.wear .dg{filter:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff)}
.rw .mini .dg.gold,.wear .dg.gold{filter:drop-shadow(2px 0 0 #E2A600) drop-shadow(-2px 0 0 #E2A600) drop-shadow(0 2px 0 #E2A600) drop-shadow(0 -2px 0 #E2A600)}
.hero .dg{height:150px}.coach .dg{height:106px}.rw .mini .dg{height:56px}.fb .dgw .dg{height:76px}.dlg-fig .dg{height:107px}.won .dg{height:132px}.wear .dg{height:58px;width:50px}
.wrap{max-width:660px;margin:0 auto;padding:18px 18px 56px}
body[data-view="teacher"] .wrap{max-width:1000px}
.mute{color:var(--mut)}

/* Knöpfe und Links */
.btn{min-height:50px;padding:0 26px;border:1.5px solid var(--ink);border-radius:var(--r);background:var(--ink);color:var(--bg);font-weight:700;font-size:16.5px}
.btn.sec{background:transparent;color:var(--ink)}
.btn.quiet{background:transparent;color:var(--ink);border:1px solid var(--ln);font-weight:600}
.btn.sm{min-height:42px;padding:0 14px;font-size:15px}
.btn:disabled{opacity:.4;cursor:default}
.lk{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;border:0;background:transparent;font-weight:600;font-size:15.5px;color:var(--pri);text-decoration:underline;text-underline-offset:3px}
.acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.acts .btn{flex:1 1 150px;min-height:54px}
.hl{background:linear-gradient(transparent 12%,var(--acc) 12% 90%,transparent 90%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 5px;margin:0 -5px;color:var(--onacc)}
.sq{font-family:var(--ft);font-size:22px;font-weight:700;display:inline-block;position:relative;padding-bottom:6px}
.sq svg{position:absolute;left:-2px;bottom:-2px;width:calc(100% + 8px);height:8px}
.pm{flex:none}
.pm .o{fill:none;stroke:var(--mut);stroke-width:1.6;stroke-linejoin:round}
.pm .t{fill:none;stroke:var(--red);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pm .g{fill:none;stroke:var(--gold);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.banner{background:var(--acc);color:var(--onacc);padding:8px 12px;border-radius:var(--r);margin-bottom:14px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1A1D25;color:#fff;font-weight:600;font-size:14px;line-height:1.3;padding:10px 16px;border-radius:8px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px)}
.toast.on{opacity:1}

/* Startseite */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:22px;padding-bottom:10px;border-bottom:1.5px solid var(--ink)}
.brand{font-family:var(--ft);font-weight:700;font-size:20px}
.wkk{font-size:14.5px;color:var(--mut);text-align:right}
.wkk b{color:var(--red);font-family:var(--ft);font-style:italic;font-size:17px}
.hero{display:grid;grid-template-columns:124px 1fr;gap:12px;align-items:start;margin-bottom:8px}
.say{font-family:var(--ft);font-size:20px;line-height:1.35;font-style:italic}
.go{display:block;width:100%;margin-top:14px;padding:6px 0;min-height:56px;border:0;background:transparent;text-align:left;font-family:var(--ft);font-size:20px;font-weight:700;line-height:1.5}
.go small{display:block;font-family:var(--fu);font-weight:500;font-size:14px;color:var(--mut);margin-top:4px}
.today{font-size:14px;color:var(--mut);margin-top:10px;min-height:20px}
.wear{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:var(--mut);margin:14px 0 4px}
.wear button{min-height:40px;padding:0 14px;border:1px solid var(--ln);background:transparent;border-radius:var(--r);font-weight:600;color:var(--ink)}
.wear button[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.wear button.wb{padding:5px 6px;min-height:70px}
.wear .wn{flex-basis:100%;font-weight:600;color:var(--ink)}
.trail{margin-top:30px}
.idx{list-style:none;margin:10px 0 0;padding:0;position:relative}
.idx::before{content:"";position:absolute;left:18px;top:30px;bottom:30px;border-left:1.6px solid var(--ln)}   /* die Linie des Pfads */
.ir{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:8px 2px;border:0;background:transparent;text-align:left;font-size:16.5px;font-weight:500}
.ir .nm{flex:1}
.nd{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:1.6px solid var(--mut);font-family:var(--ft);font-size:16px;line-height:1;color:var(--mut)}
.idx li.cur .nd{border-color:var(--ink);background:var(--acc);color:var(--onacc);font-weight:700}
.idx li.cur .nm{font-weight:700}
.idx li.fin .nd{border-color:var(--red)}
.idx li.off .ir{color:var(--mut);font-weight:400}
.idx li.off .nd{border-color:var(--ln)}
.idx li.off .mk{opacity:.45}
.mk{display:flex;gap:8px;flex:none}
.foot{margin-top:40px;padding-top:16px;border-top:1.5px solid var(--ink);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:14px;color:var(--mut)}
.foot .sp{flex:1}
.warn{margin-top:12px;font-size:14px;color:var(--red)}

/* Pfad */
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.h1{font-family:var(--ft);font-size:30px;line-height:1.15;font-weight:700;margin-bottom:16px}
.coach{display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:center;margin-bottom:14px}
.coach p{font-family:var(--ft);font-style:italic;font-size:18.5px;line-height:1.4}
.note{font-family:var(--ft);font-style:italic;color:var(--red);font-size:16px}
.lv{margin-top:26px}
.lv em{font-family:var(--ft);font-style:italic;font-size:15.5px;color:var(--red);margin-left:10px}
.rows{list-style:none;margin:8px 0 0;padding:0}
.rows li{border-bottom:1px solid var(--ln)}
.rw{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 4px;border:0;background:transparent;text-align:left}
.rw .nm{flex:1;font-family:var(--ft);font-size:18.5px;line-height:1.3}
.rw .sc{font-family:var(--ft);font-style:italic;font-size:18px;color:var(--red);flex:none}
.rw .sc.no{color:var(--mut);font-style:normal;font-size:14px;font-family:var(--fu)}
.rows li.nx .nm{font-weight:700}
.rw .mini{width:48px;flex:none}
.xp{padding:2px 4px 16px 44px;display:grid;gap:10px}
.xp p{font-size:14.5px;color:var(--mut)}
.xp .cq{font-family:var(--ft);font-style:italic;color:var(--ink);font-size:16.5px}
.xp .btn{justify-self:start}

/* Aufgabe */
.it-top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.it-x{width:44px;height:44px;margin-left:-10px;border:0;background:transparent;display:grid;place-items:center;border-radius:var(--r);flex:none}
.it-bar{flex:1;height:10px;background:var(--ln);border-radius:99px;overflow:hidden}
.it-bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.it-n{font-size:14px;font-weight:600;color:var(--mut);white-space:nowrap}
.it-where{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--mut);margin-bottom:18px;min-height:44px}
.it-where .lk{white-space:nowrap;flex:none}
.it-task{font-size:15px;color:var(--mut);margin-bottom:10px}
.it-text{font-family:var(--ft);font-size:22px;line-height:1.6}
.it-text .src{display:block;color:var(--mut);font-size:19px;margin-bottom:8px}
.it-text input,.fixin input{font-family:var(--ft);font-size:22px;color:var(--onacc);min-width:5.5em;max-width:100%;height:44px;padding:2px 8px;border:0;border-bottom:2.5px solid var(--ink);background:var(--gapbg);border-radius:var(--r) var(--r) 0 0;margin:3px 2px}
.it-text input:disabled,.fixin input:disabled{opacity:1;-webkit-text-fill-color:var(--onacc)}
.fixin{margin-top:14px}
.fixin input{width:100%}
.fixin input::placeholder{color:var(--onacc);opacity:.55}
.gap{display:inline-block;min-width:3.2em;height:1.15em;vertical-align:-.2em;background:var(--gapbg);border-bottom:2.5px solid var(--ink);border-radius:var(--r) var(--r) 0 0;margin:0 .12em}
mark{background:var(--gapbg);color:var(--onacc);padding:0 4px;border-radius:3px}
mark.ok{font-weight:700}
del{color:var(--red);text-decoration:line-through;text-decoration-thickness:2.5px}
ins{color:var(--red);text-decoration:none;font-weight:700;border-bottom:2.5px solid var(--red)}
.opts{display:grid;gap:10px;margin-top:18px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{min-height:56px;padding:10px 14px;border:1.5px solid var(--ink);background:var(--sf);border-radius:var(--r);font-family:var(--ft);font-size:19px;text-align:left}
.opts.two .opt{text-align:center}
.fb{margin-top:22px;display:flex;gap:12px;align-items:flex-start;border-top:1.5px solid var(--ink);padding:16px 0 0}
.fb .dgw{width:64px;flex:none}
.fb .tx{flex:1;min-width:0}
.fb .v{display:block;font-family:var(--ft);font-size:17.5px;font-weight:700;margin-bottom:4px}
.fb.no .v{color:var(--red)}
.fb .why{font-size:15.5px;line-height:1.45}
.it-text .pickres{display:block;margin-top:10px}
.tick{vertical-align:-3px}
@keyframes strike{from{background-size:0 2.5px}to{background-size:100% 2.5px}}
.it-text del{text-decoration:none;background:linear-gradient(var(--red),var(--red)) no-repeat 0 55%/100% 2.5px;animation:strike .28s ease-out}

.rw .sc.no{white-space:nowrap}
.xb{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.xp .xb .btn{justify-self:auto}
/* Regelkarte */
.ctop{font-family:var(--ft);font-size:19px;margin-bottom:6px}
.board.ckey p{font-family:var(--fu);font-size:14px;color:var(--mut);margin:0 0 10px}
.board.ckey .pen,.board.ckey .aux{background:none;padding:0}
.cl{padding:10px 0;border-top:1px solid var(--ln)}
.cl .cr{display:block;font-size:15.5px;margin-bottom:4px}
.cl .board p{font-size:19px;line-height:1.45;margin:0 0 .15em}
.cl .board.cn p{font-size:15.5px;color:var(--mut);margin-top:4px}
.cl.todo{color:var(--mut);font-size:14.5px;font-style:italic}
.rules .board *,.pinned .board *{animation:none!important}
.rules .board .pen,.rules .board .aux,.pinned .board .pen,.pinned .board .aux{background:none;padding-bottom:0}
.pinned{background:var(--sf);border:1.5px solid var(--ink);border-radius:var(--r);padding:6px 16px 10px;transform:rotate(-.7deg);box-shadow:3px 3px 0 var(--ln)}
.pinned .cl{border-top:0}
.pinned .cl+.cl{border-top:1px solid var(--ln)}
.pinned .cl .cr{font-family:var(--ft);font-size:20px}
.pinned .cl .board p{font-size:22px}
/* Lektion */
body[data-view="les"] .wrap{padding-bottom:0}
body[data-view="les"] #app{display:flex;flex-direction:column;min-height:calc(100vh - 20px);min-height:calc(100dvh - 20px);padding-bottom:calc(var(--dlgh,200px) + 124px + env(safe-area-inset-bottom,0px))}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 0 16px}
.board p{font-family:var(--ft);font-size:25px;line-height:1.5;margin:0 0 .55em}
.board .hlk{background:linear-gradient(transparent 10%,var(--gapbg) 10% 92%,transparent 92%) no-repeat 0 0/100% 100%;color:var(--onacc);padding:0 4px;margin:0 2px 0 -1px;border-radius:0;animation:sweep .45s ease-out}
.board .pen{color:var(--red);font-weight:700;background:linear-gradient(var(--red),var(--red)) no-repeat 0 100%/100% 2.5px;padding-bottom:2px;animation:sweep .45s ease-out}
.board .aux{color:var(--pri);font-weight:700;background:linear-gradient(var(--pri),var(--pri)) no-repeat 0 100%/100% 2.5px;padding-bottom:2px;animation:sweepu .45s ease-out}
.board .mnote{display:inline-block;font-style:italic;font-size:.68em;color:var(--red);margin-left:10px;transform:rotate(-2deg);animation:fadein .5s ease-out}
.board .old{animation:none!important}
.board del{text-decoration:line-through;text-decoration-thickness:2.5px}
@keyframes sweep{from{background-size:0 100%}}
.board .pen{animation-name:sweepu}
@keyframes sweepu{from{background-size:0 2.5px}}
@keyframes fadein{from{opacity:0}}
.opt.right{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red);opacity:1}
.opt.wrong{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2.5px;color:var(--mut);opacity:1}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default}
.dlg{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 12px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dlg-in{pointer-events:auto;cursor:pointer;position:relative;max-width:660px;margin:0 auto;background:var(--sf);border:2px solid var(--ink);border-radius:4px;box-shadow:5px 5px 0 var(--ink);padding:20px 16px 8px}
.dlg-fig{position:absolute;left:6px;bottom:100%;width:96px;margin-bottom:-10px;pointer-events:none}
.dlg-name{position:absolute;left:106px;top:-13px;font-weight:700;font-size:13.5px;letter-spacing:.02em;background:var(--ink);color:var(--sf);padding:2px 10px;border-radius:2px}
.dlg-tx p{font-family:var(--ft);font-size:19px;line-height:1.4;min-height:5.6em}
.dlg-ft{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.dlg-hint{font-size:14px;color:var(--mut);font-style:italic}
.dlg-more{display:inline-block;margin-left:8px;font-size:11px;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
/* Ergebnis */
.grade{font-family:var(--ft);font-style:italic;font-weight:700;color:var(--red);font-size:64px;line-height:1;margin:10px 0 12px;display:inline-block;transform:rotate(-3deg);position:relative;padding-bottom:8px}
.grade svg{position:absolute;left:-2px;bottom:0;width:calc(100% + 8px);height:8px}
.resline{font-size:16.5px;margin-bottom:18px}
.sub{font-family:var(--ft);font-size:20px;font-weight:700;margin:26px 0 8px}
.corr{font-family:var(--ft);font-size:17.5px;line-height:1.5;border-top:1px solid var(--ln);padding:10px 0}
.corr small{display:block;font-family:var(--fu);color:var(--mut);font-size:14px;margin-top:2px}
.won{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;margin:18px 0 4px;padding:12px 0;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.won b{display:block;font-family:var(--ft);font-size:19px}
.won p{font-family:var(--ft);font-style:italic;font-size:16.5px;margin-top:4px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0 20px}
.kv div{border-top:1.5px solid var(--ink);padding-top:8px}
.kv b{display:block;font-family:var(--ft);font-size:28px;line-height:1.1}
.kv span{color:var(--mut);font-size:14px}
.txt{margin-bottom:12px}

/* Regelkarte */
.sheet{position:fixed;inset:0;background:rgba(10,12,18,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet>div{background:var(--sf);width:100%;max-width:700px;max-height:92vh;overflow:auto;border-radius:10px 10px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{align-items:center}.sheet>div{border-radius:6px}}
.askq{font-family:var(--ft);font-size:19px;line-height:1.4}
.rules h1{font-family:var(--ft);font-size:24px;line-height:1.2;margin-bottom:10px}
.rules h2{font-family:var(--ft);font-size:19px;margin:18px 0 6px}
.rules p{margin-bottom:10px}
.rules table{border-collapse:collapse;width:100%;margin:8px 0 14px;font-size:15px}
.rules th,.rules td{border:1px solid var(--ln);padding:8px 9px;text-align:left;vertical-align:top}
.rules .ex{font-family:var(--ft);font-style:italic;font-size:1.06em}
.rules ul{padding-left:20px;margin:6px 0}
.rules li{margin-bottom:7px}
.tblwrap{overflow-x:auto}

/* Lehreransicht */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}
.tabs .btn.on{background:var(--ink);color:var(--bg)}
textarea,.code,.pin{width:100%;border:1.5px solid var(--ln);border-radius:var(--r);background:var(--sf);padding:10px;font-size:16px}
textarea,.code{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
textarea{min-height:110px}
.code{font-size:13px;user-select:all;-webkit-user-select:all;margin-top:6px}
.pin{flex:1 1 160px;min-height:54px;border-color:var(--ink)}
table.cls{border-collapse:collapse;width:100%;font-size:13.5px;min-width:960px}
table.cls th,table.cls td{border-bottom:1px solid var(--ln);padding:7px 8px;text-align:left;vertical-align:top}
table.cls th{border-bottom:1.5px solid var(--ink)}
table.cls td:nth-child(6){min-width:250px}
.flag{color:var(--red);font-weight:600}
.sol{font-family:var(--ft);border-top:1px solid var(--ln);padding:8px 0}
.sol code{font-family:var(--fu);color:var(--mut);font-size:13px;margin-right:6px}
.sol b{color:var(--pri)}
details{margin:4px 0}
summary{padding:10px 0;cursor:pointer}
.tsec{font-family:var(--ft);font-size:20px;font-weight:700;margin:24px 0 8px}

@media (min-width:640px){
  .wrap{padding:30px 24px 64px}
  .hero{grid-template-columns:190px 1fr;gap:24px;align-items:center}
  .say{font-size:24px}.go{font-size:23px}
  .h1{font-size:38px}
  .it-text{font-size:24px}
  .board p{font-size:32px}
  .dlg-in{padding:26px 22px 10px}
  .dlg-fig{width:136px;left:10px;margin-bottom:-13px}
  .hero .dg{height:230px}.dlg-fig .dg{height:151px}
  .dlg-name{left:156px;font-size:14.5px}

function boardHTML(src,prev,fill){ // Farben, überall gleich: <<Hilfsverb>> blau, {Verbform} rot, [Zeitwort] gelb. Dazu ~durchgestrichen~ ^Randnotiz^ ___ Lücke

function typeOut(){ // Text erscheint Buchstabe für Buchstabe; Tippen zeigt ihn sofort ganz

function parseRows(txt){

  txt.split(/\n+/).forEach((line,ix)=>{
    const m=line.match(/GT3\.[A-Za-z0-9_\-]+\.[0-9a-f]{6}/); if(!m)return;
    const who=(line.match(/[^\s,;"]+@[^\s,;"]+/)||[])[0]||('Zeile '+(ix+1));
    map.set(who,{o:decodeCode(m[0]),code:m[0]});
  });
  return Array.from(map,([who,v])=>({who,o:v.o,code:v.code}));
}

/* ---------- Antworten prüfen ---------- */
function sayFor(it,ok,pts){ // Doggo ist nach Fehlern da und ab und zu nach Erfolgen, nie am Checkpoint
  if(run.kind==='cp')return {fig:null,line:ok?'Right.':'Not quite.'};
  if(!ok){run.row=0;const q=UNIT[it.u].quips[it.g];
    return {fig:'dry',line:q&&q.length&&Math.random()<.5?pickLine('q.'+it.u+it.g,q):pickLine('wrong',SAY.wrong)};}
  if(pts<1){run.row=0;return {fig:null,line:'Right on the second try.'};}
  run.row++;
  if(run.row%3===0)return {fig:'happy',line:run.row===3?pickLine('row',SAY.row):pickLine('right',SAY.right)};
  return {fig:null,line:'Right.'};
}
function finishItem(it,ok,pts,given,each,typo){
  const res={id:it.id,ok,pts,given,each}; run.res.push(res); run.pts+=pts;
  if(run.kind==='place')return next();
  res.say=sayFor(it,ok,pts); run.cur={given:Array.isArray(given)?given:[]}; run.phase='fb';
  if(!run.preview)record(it,ok&&pts===1,typo);
  render(); const b=$('#nextbtn'); if(b)b.focus({preventScroll:true});
}
function readInputs(it){return (it.t==='fix'?[0]:it.a.map((_,k)=>k)).map(k=>{const e=$('#g'+k);return e?e.value:'';});}
function check(noMistake){
  const it=BY[run.items[run.i]]; if(run.phase==='fb')return;
  const allowRetry=run.kind==='set'||run.kind==='warm';
  if(it.t==='fix'){
    const given=readInputs(it), isOK=it.h[0]==='OK';
    if(noMistake)return finishItem(it,isOK,isOK?(run.try===1?1:.5):0,['no mistake'],[isOK?'ok':'no'],run.typoUsed);
    if(!norm(given[0]))return;
    if(isOK)return finishItem(it,false,0,given,['no'],run.typoUsed);
    return settle(it,judgeAll(given,it),given,allowRetry);
  }
  const given=readInputs(it); if(given.some(g=>!norm(g)))return;
  settle(it,judgeAll(given,it),given,allowRetry);
}
function settle(it,j,given,allowRetry){
  if(run.kind==='place')return finishItem(it,j.v!=='no',j.v!=='no'?1:0,given,j.each,false);
  if(j.v==='ok')return finishItem(it,true,run.try===1?1:.5,given,j.each,run.typoUsed);
  if(j.v==='typo'&&!run.typoUsed){run.typoUsed=true;run.cur={given,typo:true};run.phase='retry';return render(true);}
  if(allowRetry&&run.try===1){run.try=2;run.cur={given};run.phase='retry';return render(true);}
  finishItem(it,false,0,given,j.each.map(x=>x==='typo'?'no':x),run.typoUsed);
}
function pick(v){const it=BY[run.items[run.i]], ok=v===it.c; finishItem(it,ok,ok?1:0,v,null,false);}
function next(){
  run.i++; run.phase='ask'; run.try=1; run.typoUsed=false; run.cur=null; run.opts=null;
  if(run.i>=run.items.length)closeRun();
  render();
}
function week(){touchDay();if(markWeek(S.wk,S.today.d))S.wk.day=S.today.d;}
function costume(U,e0){ // neues Kostüm? Doggo zieht es an, wenn er noch nichts trägt
  const e1=earned(U); if(e1<=e0||!COSTUMES[run.uid])return;
  run.won=e1; if(S.wear==='none'||S.wear===run.uid)S.wear=run.uid+(e1===2?'+':'');
}
function closeRun(){
  const n=run.items.length, pct=Math.round(run.pts/n*100);
  if(run.kind==='place'){
    const pl=[0,0,0]; run.res.forEach((r,i)=>{if(r.ok)pl[Math.floor(i/4)]++;}); const o=placeLevel(pl); run.out={pl,st:o.st,to:o.to};
    if(!run.preview){const U=touchU(run.uid),e0=earned(U);U.pl=pl;U.st=o.st;U.to=o.to;costume(U,e0);week();save();}
    return;
  }
  if(run.kind==='set'){const s=statusFor(pct);run.endLine=pct===100?pickLine('perfect',SAY.perfect):pickLine('set'+s,SAY['set'+s]);}
  else if(run.kind==='cp')run.endLine=pct>=80?pickLine('cpPass',SAY.cpPass):pickLine('cpFail',SAY.cpFail);
  if(run.preview)return;
  if(run.kind==='warm'){S.today.warm=true;week();save();return;}
  const U=touchU(run.uid), lv=U.lv[run.L], e0=earned(U);
  if(run.kind==='set'){if(!lv.a)lv.a=[0,0];lv.a[run.n-1]++;lv.s[run.n-1]=Math.max(lv.s[run.n-1],statusFor(pct));lv.p[run.n-1]=Math.max(lv.p[run.n-1],pct);if(lv.r===run.n)lv.r=0;}
  else{lv.c[0]++;lv.c[2]=Math.max(lv.c[2],pct);
    if(pct>=80){lv.c[1]=1;lv.r=0;}
    else{const w=weakSet(lv);lv.r=w;if(lv.c[0]===1){if(!Array.isArray(lv.l))lv.l=[0,0,0,0];lesList(run.uid,run.L,w).forEach(m=>{lv.l[m-1]=2;});}}   // beim ersten Fehlschlag: Lektionen des schwächsten Sets noch einmal
  }
  costume(U,e0); week(); save();
}

  if(act==='pin'){if($('#pin').value===CONFIG.TEACHER_PIN){tView.ok=true;render();}else $('#pinmsg').textContent='PIN stimmt nicht.';return;}
  if(act==='tab'){tView.tab=t.dataset.v;return render();}
  if(act==='tunit'){tView.unit=t.dataset.u;return render();}
  if(act==='klsave'){try{localStorage.setItem(KEY+'.klasse',$('#kl').value);}catch(err){}const v=$('#kl').value;render();if(!storeOK)$('#kl').value=v;return;}
  if(act==='tlink'){const r=parseRows($('#kl').value)[+t.dataset.ix];if(!r)return;const link=restoreLink(r.code);
    $('#linkout').innerHTML='<h2 class="tsec">Link f\u00FCr '+esc(r.who)+'</h2><p class="txt" id="linkmsg">Link markieren und kopieren, dann der Person schicken. Wer ihn \u00F6ffnet, kann diesen Stand laden.</p><div class="code">'+esc(link)+'</div>';
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(link).then(()=>{$('#linkmsg').textContent='Der Link ist kopiert. Schick ihn der Person. Wer ihn \u00F6ffnet, kann diesen Stand laden.';},()=>{});
    return;}
  if(act==='pv')return start(t.dataset.k,tView.unit,t.dataset.l,+t.dataset.n||0,true);
  if(act==='reset')return ask('Wirklich den gesamten Fortschritt auf diesem Ger\u00E4t l\u00F6schen?','L\u00F6schen','Abbrechen',()=>{S=fresh();touchDay();save();render();$('#resetmsg').textContent='Zur\u00FCckgesetzt.';});
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='pin'){e.preventDefault();$('[data-act=pin]').click();return;}
  if(view==='les'&&les&&e.target.tagName!=='BUTTON'){e.preventDefault();return lessonNext();}
  if(view!=='run'||!run)return;
  if(e.target.tagName==='INPUT'&&run.phase!=='fb'){e.preventDefault();check(false);}
});

/* ---------- Start ---------- */
function boot(skipLink){
  touchDay();
  const m=skipLink?null:/^#r=(.+)$/.exec(location.hash||'');
  const need=Object.keys(S.units).filter(id=>UMETA[id]&&UMETA[id].on), cu=curUnit();
  if(cu&&need.indexOf(cu)<0)need.push(cu);
  loadAll(need).then(()=>{
    if(m){let c=m[1];try{c=decodeURIComponent(c);}catch(e){}restoreO=decodeCode(c);view='restore';}
    else view='home';
    run=null;render();
  },fail);
}
boot(false); tick(); figPreload();
</script>
